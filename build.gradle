plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.76'
}


version = '8.0.12+1.19.2+forge'
group = 'ct.buildcraft.ce' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'BuildCraft-Community-Edition'

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)


// Keep world-dependent Forge GameTests separate from fast JUnit tests.
sourceSets {
    gameTest {
        // A source set named gameTest already gets default src/gameTest paths.
        // On Windows that path is the same as src/gametest, so srcDir() adds
        // the same directory twice and processGameTestResources sees duplicates.
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // Do not put main.compileClasspath on the runtime path: it contains
        // compileOnly compatibility mods such as IC2 Classic. ForgeGradle supplies
        // the Minecraft/Forge launch classpath; the tests only need both outputs.
        runtimeClasspath += output + sourceSets.main.output
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Optional compatibility dependencies are downloaded from Modrinth Maven.
// They remain compile-only unless their runtime switch is enabled, and are never
// bundled into the BuildCraft jar. Version IDs pin the exact Forge files.
def jadeModrinthVersion = providers.gradleProperty('jade_modrinth_version').getOrElse('kp0HjPre')
def ic2ClassicModrinthVersion = providers.gradleProperty('ic2_classic_modrinth_version').getOrElse('2.1.3.3')
def carbonConfigModrinthVersion = providers.gradleProperty('carbon_config_modrinth_version').getOrElse('8U1HA7TK')
def forestryModrinthVersion = providers.gradleProperty('forestry_modrinth_version').getOrElse('q98RKZEA')
def patchouliModrinthVersion = providers.gradleProperty('patchouli_modrinth_version').getOrElse('62ztr7HA')
def enableIc2Runtime = providers.gradleProperty('enable_ic2_runtime')
        .map { it.toBoolean() }
        .getOrElse(false)
// Keep optional compatibility mods out of the dedicated GameTest server.
// Several of them assume a normal client/server lifecycle during construction.
def gameTestRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('gametest')
}
def jadeDependency = "maven.modrinth:nvQzSEkH:${jadeModrinthVersion}"
def ic2ClassicDependency = "maven.modrinth:nIaMQHTd:${ic2ClassicModrinthVersion}"
def carbonConfigDependency = "maven.modrinth:1jDdpgcc:${carbonConfigModrinthVersion}"
def forestryDependency = "maven.modrinth:2oORTOi2:${forestryModrinthVersion}"
def patchouliDependency = "maven.modrinth:patchouli:${patchouliModrinthVersion}"

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.19.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg') // Currently, this location cannot be changed from the default.

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Remap production SRG names from dependency mixin refmaps to the
            // official mappings used by this ForgeGradle development workspace.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            // Every BuildCraft test currently reuses Forge's empty3x3x3 structure,
            // so Forge filters it by the template namespace "forge", not by
            // the @GameTestHolder namespace. Keep buildcraftlib enabled as well
            // for future tests with BuildCraft-owned templates.
            property 'forge.enabledGameTestNamespaces', 'forge,buildcraftlib'

            mods {
                buildcraft {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Remap production SRG names from dependency mixin refmaps to the
            // official mappings used by this ForgeGradle development workspace.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Every BuildCraft test currently reuses Forge's empty3x3x3 structure,
            // so Forge filters it by the template namespace "forge", not by
            // the @GameTestHolder namespace. Keep buildcraftlib enabled as well
            // for future tests with BuildCraft-owned templates.
            property 'forge.enabledGameTestNamespaces', 'forge,buildcraftlib'

            mods {
                buildcraft {
                    source sourceSets.main
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run')
            setForceExit false

            // Remap production SRG names from dependency mixin refmaps to the
            // official mappings used by this ForgeGradle development workspace.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Every BuildCraft test currently reuses Forge's empty3x3x3 structure,
            // so Forge filters it by the template namespace "forge", not by
            // the @GameTestHolder namespace. Keep buildcraftlib enabled as well
            // for future tests with BuildCraft-owned templates.
            property 'forge.enabledGameTestNamespaces', 'forge,buildcraftlib'

            mods {
                buildcraft {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Remap production SRG names from dependency mixin refmaps to the
            // official mappings used by this ForgeGradle development workspace.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'buildcraft', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                buildcraft {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { name="sponge"; url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Specify the version of Minecraft to use. If this is any group other than 'net.minecraft', it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency, and its patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'

//    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}") // Adds registrate as a dependency

    // JEI from Modrinth Maven. Modrinth does not publish a separate API artifact here,
    // so the full mod jar is used as compileOnly and runtimeOnly.
    compileOnly fg.deobf("maven.modrinth:u6dRKJwZ:qMHEoNl6")
    if (!gameTestRequested) {
        runtimeOnly fg.deobf("maven.modrinth:u6dRKJwZ:qMHEoNl6")
    }

    // Jade API/full jar for optional Jade compatibility.
    compileOnly fg.deobf(jadeDependency)
    if (!gameTestRequested) {
        runtimeOnly fg.deobf(jadeDependency)
    }

    // IC2 Classic is optional at runtime, but its API is available while compiling compat code.
    // Carbon Config is declared separately because Modrinth Maven has no transitive metadata.
    compileOnly fg.deobf(ic2ClassicDependency)
    compileOnly fg.deobf(carbonConfigDependency)

    if (enableIc2Runtime && !gameTestRequested) {
        runtimeOnly fg.deobf(ic2ClassicDependency)
        runtimeOnly fg.deobf(carbonConfigDependency)
    }

    // Forestry Community Edition API for optional genome-aware list matching.
    compileOnly fg.deobf(forestryDependency)
    runtimeOnly fg.deobf(forestryDependency)

    // Patchouli API/full jar for guidebook integration. Modrinth does not publish
    // a separate API classifier, so the same jar is used for compilation and dev runtime.
    compileOnly fg.deobf(patchouliDependency)
    if (!gameTestRequested) {
        runtimeOnly fg.deobf(patchouliDependency)
    }

    // JUnit tests cover deterministic logic without launching Minecraft.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "BuildCraft Community Edition",
                "Specification-Vendor"    : "CurativeTree, ShipovskijKorp",
                "Specification-Version"   : project.version,
                "Implementation-Title"    : "BuildCraft Community Edition",
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "CurativeTree, ShipovskijKorp",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:none')

}
