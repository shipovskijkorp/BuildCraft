# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Optional compatibility dependencies downloaded from Modrinth Maven.
# Exact Modrinth version IDs are used where loader variants share a version number.
jade_modrinth_version=kp0HjPre
ic2_classic_modrinth_version=2.1.3.3
carbon_config_modrinth_version=8U1HA7TK
forestry_modrinth_version=q98RKZEA
patchouli_modrinth_version=62ztr7HA

# IC2 Classic and Carbon Config are compile-only unless this is enabled.
# They are never bundled into the BuildCraft jar.
enable_ic2_runtime=true
