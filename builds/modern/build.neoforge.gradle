plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

def targetName = project.name
def buildGeneration = 'modern'
def repositoryRoot = rootProject.file('../..').canonicalFile

def commonConfigFile = new File(repositoryRoot, 'build-config/common.properties')
def targetConfigFile = rootProject.file('targets.properties')
if (!commonConfigFile.isFile() || !targetConfigFile.isFile()) {
    throw new GradleException("Missing BuildCraft configuration for ${buildGeneration} build")
}

def targetConfiguration = new Properties()
commonConfigFile.withInputStream { targetConfiguration.load(it) }
targetConfigFile.withInputStream { targetConfiguration.load(it) }

def configuredProperty = { String key ->
    if (project.hasProperty(key)) {
        return project.property(key).toString().trim()
    }
    def targetValue = targetConfiguration.getProperty("target.${targetName}.${key}")
    if (targetValue != null) {
        return targetValue.trim()
    }
    def commonValue = targetConfiguration.getProperty("common.${key}")
    commonValue != null ? commonValue.trim() : null
}

def requiredProperty = { String key ->
    def value = configuredProperty(key)
    if (value == null || value.isEmpty()) {
        throw new GradleException("Missing target property '${key}' for '${targetName}'")
    }
    value
}

def optionalProperty = { String key -> configuredProperty(key) ?: '' }

def booleanProperty = { String key, boolean fallback ->
    def configured = configuredProperty(key)
    if (configured != null && !configured.isEmpty()) {
        return configured.toBoolean()
    }
    providers.gradleProperty(key).map { it.toBoolean() }.getOrElse(fallback)
}

def targetParts = targetName.split('-', 2)
def minecraftVersion = requiredProperty('deps.minecraft')
def neoForgeVersion = requiredProperty('deps.neoforge')
def loaderName = targetParts[1]
def modVersion = requiredProperty('mod.version')
def archiveName = requiredProperty('mod.archive_name')
def javaVersion = Integer.parseInt(requiredProperty('java.version'))
def sourceFamily = requiredProperty('source.family')
def sourcePlatform = requiredProperty('source.platform')
def sharedSourceRoot = new File(repositoryRoot, requiredProperty('source.shared_root'))
def familySourceRoot = new File(repositoryRoot, requiredProperty('source.root'))
def platformSourceRoot = new File(repositoryRoot, requiredProperty('source.platform_root'))
def targetOverlayRoot = new File(repositoryRoot, requiredProperty('source.overlay_root'))
def sourceLayers = [sharedSourceRoot, familySourceRoot, platformSourceRoot, targetOverlayRoot]
def resolveSourceFile = { String relative ->
    [targetOverlayRoot, platformSourceRoot, familySourceRoot, sharedSourceRoot]
            .collect { new File(it, relative) }.find { it.isFile() }
}
def targetAccessTransformer = resolveSourceFile('src/main/resources/META-INF/accesstransformer.cfg')
def jeiCompatEnabled = booleanProperty('compat.jei.enabled', true)
def jadeCompatEnabled = booleanProperty('compat.jade.enabled', true)
def ic2CompatEnabled = booleanProperty('compat.ic2.enabled', false)
def forestryCompatEnabled = booleanProperty('compat.forestry.enabled', false)

for (def layer : sourceLayers) {
    if (!layer.isDirectory()) {
        throw new GradleException("Configured source layer '${layer}' for '${targetName}' does not exist")
    }
}
if (targetAccessTransformer == null) {
    throw new GradleException("No access transformer found for '${targetName}'")
}

def effectiveSourceRoot = layout.buildDirectory.dir("effective-source/${targetName}")
def sourceLayoutScript = new File(repositoryRoot, 'scripts/source_layout.py')
def defaultPythonExecutable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3'
def pythonExecutable = providers.gradleProperty('pythonExecutable')
        .orElse(providers.environmentVariable('PYTHON'))
        .getOrElse(defaultPythonExecutable)
def prepareEffectiveSource = tasks.register('prepareEffectiveSource', Exec) {
    group = 'build setup'
    description = "Materialize and preprocess BuildCraft source layers for ${targetName}"
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    inputs.files(sourceLayers)
    inputs.files(commonConfigFile, targetConfigFile, sourceLayoutScript)
    outputs.dir(effectiveSourceRoot)
    commandLine pythonExecutable, sourceLayoutScript.absolutePath, targetName,
            '--config', targetConfigFile.absolutePath,
            '--output', effectiveSourceRoot.get().asFile.absolutePath
}

def effectiveSourceDir = effectiveSourceRoot.get().asFile
def effectiveDirs = { String relative -> [new File(effectiveSourceDir, relative)] }

version = "${modVersion}+${targetName.replace('-', '+')}"
group = requiredProperty('mod.group')
base.archivesName = archiveName

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

println "Target: ${targetName}; Java: ${providers.systemProperty('java.version').get()}, " +
        "JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), " +
        "Arch: ${providers.systemProperty('os.arch').get()}"

def gameTestRunRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('rungametestserver')
}

sourceSets {
    main {
        java.setSrcDirs(effectiveDirs('src/main/java'))
        resources.setSrcDirs(effectiveDirs('src/main/resources'))
        if (gameTestRunRequested) {
            java.srcDir(new File(effectiveSourceDir, 'src/gametest/java'))
            resources.srcDir(new File(effectiveSourceDir, 'src/gametest/resources'))
        }
    }
    test {
        java.setSrcDirs(effectiveDirs('src/test/java'))
        resources.setSrcDirs(effectiveDirs('src/test/resources'))
    }
    gameTest {
        java.setSrcDirs(effectiveDirs('src/gametest/java'))
        resources.setSrcDirs(effectiveDirs('src/gametest/resources'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output
    }
}

if (!jeiCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/jei/**'
}
if (!jadeCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/jade/**'
}
if (!ic2CompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/ic2/**'
}
if (!forestryCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/forestry/**'
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

// Keep target-specific values out of the Java source snapshots.
def generatedTargetSources = layout.buildDirectory.dir('generated/sources/buildcraftTarget/java')
def targetValues = [
        minecraft: minecraftVersion,
        loader: 'neoforge',
        protocol: requiredProperty('network.protocol')
]

def javaLiteral = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"')
}

def generateBuildCraftTarget = tasks.register('generateBuildCraftTarget') {
    inputs.properties(targetValues)
    outputs.dir(generatedTargetSources)

    doLast {
        def outputFile = generatedTargetSources.get()
                .file('buildcraft/lib/net/BuildCraftTarget.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText("""package buildcraft.lib.net;

/** Generated by Gradle for the ${targetName} Stonecutter target. */
public final class BuildCraftTarget {
    public static final String MINECRAFT_VERSION = \"${javaLiteral(targetValues.minecraft)}\";
    public static final String LOADER = \"${javaLiteral(targetValues.loader)}\";
    public static final String NETWORK_PROTOCOL = \"${javaLiteral(targetValues.protocol)}\";

    private BuildCraftTarget() {}
}
""", 'UTF-8')
    }
}

sourceSets.main.java.srcDir(generatedTargetSources)
tasks.named('compileJava') { dependsOn(generateBuildCraftTarget) }

def ciRuntimeProfile = providers.gradleProperty('ci_runtime_profile')
        .map { it.trim().toLowerCase() }
        .getOrElse('default')
def knownCiRuntimeProfiles = ['default', 'base', 'forestry', 'ic2', 'jei', 'jade', 'all']
if (!knownCiRuntimeProfiles.contains(ciRuntimeProfile)) {
    throw new GradleException("Unsupported ci_runtime_profile '${ciRuntimeProfile}'. Expected one of: ${knownCiRuntimeProfiles.sort().join(', ')}")
}

def gameTestRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('gametest')
}
def runtimeEnabled = { String profile, boolean defaultEnabled ->
    if (gameTestRequested) return false
    if (ciRuntimeProfile == 'default') return defaultEnabled
    ciRuntimeProfile == 'all' || ciRuntimeProfile == profile
}

def buildcraftModIds = [
        'buildcraftlib',
        'buildcraftcore',
        'buildcraftfactory',
        'buildcrafttransport',
        'buildcraftenergy',
        'buildcraftbuilders',
        'buildcraftsilicon',
        'buildcraftrobotics'
]
def buildcraftModIdList = buildcraftModIds.join(',')
def runDirectory = new File(repositoryRoot, "run/${buildGeneration}/${targetName}")
def dataRunDirectory = new File(repositoryRoot, "run-data/${buildGeneration}/${targetName}")
def generatedResources = new File(repositoryRoot, "build/generated-resources/${buildGeneration}/${targetName}")

neoForge {
    version = neoForgeVersion
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gameTest

    if (targetAccessTransformer.isFile()) {
        accessTransformers.from(targetAccessTransformer)
    }

    runs {
        client {
            client()
            gameDirectory = runDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', 'buildcraftlib'
        }

        server {
            server()
            gameDirectory = runDirectory
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'buildcraftlib'
        }

        gameTestServer {
            type = 'gameTestServer'
            // GameTest sources are merged into main only for this run so BuildCraft
            // is exposed as one module/source set at runtime.
            sourceSet = sourceSets.main
            gameDirectory = runDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', 'buildcraftlib'
        }

        data {
            data()
            gameDirectory = dataRunDirectory
            programArguments.addAll(
                    '--mod', buildcraftModIdList,
                    '--all',
                    '--output', generatedResources.absolutePath,
                    '--existing', effectiveSourceRoot.get().dir('src/main/resources').asFile.absolutePath
            )
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        buildcraftlib {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources.srcDir(generatedResources)

tasks.matching { it.name == 'runData' }.configureEach {
    dependsOn prepareEffectiveSource
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    def jeiDependency = optionalProperty('deps.jei')
    if (jeiCompatEnabled && jeiDependency) {
        compileOnly jeiDependency
        if (runtimeEnabled('jei', true)) {
            localRuntime jeiDependency
        }
    }

    def jadeDependency = optionalProperty('deps.jade')
    if (jadeCompatEnabled && jadeDependency) {
        compileOnly jadeDependency
        if (runtimeEnabled('jade', true)) {
            localRuntime jadeDependency
        }
    }

    if (ic2CompatEnabled) {
        throw new GradleException('IC2 compatibility is enabled, but no NeoForge 1.21.1 IC2 dependency is configured.')
    }
    if (forestryCompatEnabled) {
        throw new GradleException('Forestry compatibility is enabled, but no NeoForge 1.21.1 Forestry dependency is configured.')
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${requiredProperty('deps.junit')}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${requiredProperty('deps.junit')}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${requiredProperty('deps.junit')}"
}

tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn prepareEffectiveSource
    workingDir effectiveSourceRoot.get().asFile
    systemProperty 'buildcraft.expectedPackFormat', requiredProperty('pack.format')
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

def resourceProperties = [
        mod_version: project.version.toString(),
        mod_license: requiredProperty('mod.license'),
        loader_version_range: requiredProperty('loader.version_range'),
        neo_version_range: requiredProperty('neoforge.version_range'),
        minecraft_version_range: requiredProperty('minecraft.version_range'),
        pack_format: requiredProperty('pack.format'),
        resource_pack_format: requiredProperty('pack.resource_format'),
        data_pack_format: requiredProperty('pack.data_format')
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(resourceProperties)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(resourceProperties)
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title': requiredProperty('mod.name'),
                'Specification-Vendor': requiredProperty('mod.authors'),
                'Specification-Version': modVersion,
                'Implementation-Title': requiredProperty('mod.name'),
                'Implementation-Version': project.version,
                'Implementation-Vendor': requiredProperty('mod.authors')
        ])
    }
}

tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = "Build and collect the ${targetName} production jar"
    dependsOn tasks.named('build')
    from tasks.named('jar').flatMap { it.archiveFile }
    into new File(repositoryRoot, "build/libs/${buildGeneration}/${modVersion}")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = new File(repositoryRoot, "mcmodsrepo/${buildGeneration}").toURI()
        }
    }
}



tasks.withType(ProcessResources).configureEach {
    dependsOn prepareEffectiveSource
}
tasks.withType(JavaCompile).configureEach {
    dependsOn prepareEffectiveSource
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:none')
}

idea.module {
    downloadJavadoc = true
    downloadSources = true
}

eclipse.classpath {
    downloadJavadoc = true
    downloadSources = true
}
